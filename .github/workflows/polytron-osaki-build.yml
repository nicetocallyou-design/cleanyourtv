
name: Build CleanYourTV APK for Polytron OSAKI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/polytron-osaki-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Integrate SUMBAJANG prayer widget
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive = Path("SUMBAJANG-Polytron-GitHub-Patch.zip")
          if not archive.is_file():
              raise SystemExit("SUMBAJANG ZIP not found")
          with zipfile.ZipFile(archive) as z:
              z.extractall(".sumbajang-package")
          PY
          python .sumbajang-package/SUMBAJANG-Polytron-GitHub-Patch/apply_sumbajang.py --launcher launcher
      - name: Build APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p output
          cp launcher/app/build/outputs/apk/release/app-release.apk output/CleanYourTV-Polytron-OSAKI.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Polytron-OSAKI-APK
          path: output/CleanYourTV-Polytron-OSAKI.apk
          retention-days: 14
